name: Tests automatises

on:
  push:
    branches:
      - '**'
    paths:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests-unitaires:
    name: Tests unitaires
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer les dependances
        run: python -m pip install --upgrade -r requirements.txt

      - name: Executer les tests unitaires
        run: python tests-unitaire/test-app.py

      - name: Conserver le rapport
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-tests-unitaires
          path: reports/unitaire
          if-no-files-found: ignore

  tests-api:
    name: Tests API
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer les dependances
        run: python -m pip install --upgrade -r requirements.txt

      - name: Executer les tests API
        run: python -m robot --outputdir reports/api tests_api

      - name: Conserver le rapport API
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-tests-api
          path: reports/api
          if-no-files-found: ignore

  tests-ihm:
    name: Tests IHM
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer les dependances
        run: python -m pip install --upgrade -r requirements.txt

      - name: Attendre la disponibilite du site IHM
        run: |
          for attempt in 1 2 3 4 5 6; do
            if curl --ipv4 --fail --silent --show-error --connect-timeout 10 --max-time 30 http://livraison3.testacademy.fr/ > /dev/null; then
              exit 0
            fi
            sleep 10
          done
          exit 1

      - name: Executer les tests IHM
        run: xvfb-run --auto-servernum python -m robot --outputdir reports/ihm tests_ihm

      - name: Conserver le rapport IHM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-tests-ihm
          path: reports/ihm
          if-no-files-found: ignore
